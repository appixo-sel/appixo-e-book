<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0b1120" />
<title>Appixo Book · Consultation</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- 🔒 LOCK OVERLAY -->
<div class="lock-overlay active" id="lockOverlay">
  <div class="lock-card">
    <div class="lock-logo">
      <span class="logo-main">Appixo Book</span>
      <span class="logo-sub">✦ Consultation ✦</span>
      <span class="logo-tagline">🔒 Accès sécurisé</span>
    </div>
    <div class="lock-icon">🔐</div>
    <h2 class="lock-title">Accès au carnet</h2>
    <p class="lock-desc">Entrez le mot de passe pour consulter</p>
    <div class="lock-input-group">
      <input type="password" id="lockPassword" placeholder="Mot de passe" autocomplete="off" />
      <button class="lock-btn-unlock" id="btnUnlock">Déverrouiller</button>
      <div class="lock-error" id="lockError">❌ Mot de passe incorrect</div>
    </div>
    <div class="lock-footer">💡 Démo : <code>appixo</code> · Appixo Book • v2.4</div>
  </div>
</div>

<!-- 📖 BOOK CONTAINER -->
<div class="book-container locked-blur" id="bookContainer">

  <!-- TOP BAR -->
  <div class="top-bar">
    <div class="top-bar-left">
      <div class="page-indicator">
        <span class="label">Page</span>
        <span class="num" id="currentPage">1</span>
        <span class="total">/ <span id="totalPages">1</span></span>
      </div>
    </div>
    <div class="lang-switch" id="langSwitch">
      <button data-lang="fr" class="active">🇫🇷 FR</button>
      <button data-lang="en">🇬🇧 EN</button>
      <button data-lang="ar">🇸🇦 AR</button>
    </div>
  </div>

  <!-- BOOK VIEW -->
  <div class="book-view">
    <div class="page-wrapper">
      <div class="page-content" id="pageContent"></div>
    </div>
  </div>

  <!-- BOTTOM ACTIONS -->
  <div class="bottom-actions">
    <button class="btn-prev" id="btnPrev" title="Précédent">
      <span class="icon">◀</span><span class="label">Préc.</span>
    </button>
    <button class="btn-next" id="btnNext" title="Suivant">
      <span class="icon">▶</span><span class="label">Suiv.</span>
    </button>
    <div class="separator"></div>
    <button class="btn-download" id="btnDownload" title="Télécharger">
      <span class="icon">⬇️</span><span class="label">Téléch.</span>
    </button>
    <button class="btn-print" id="btnPrint" title="Imprimer">
      <span class="icon">🖨️</span><span class="label">Imprimer</span>
    </button>
    <button class="btn-export" id="btnExport" title="Sauvegarder">
      <span class="icon">💾</span><span class="label">Sauver</span>
    </button>
  </div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox-overlay" id="lightbox">
  <button class="close-btn" id="lightboxClose">✕</button>
  <img id="lightboxImg" src="" alt="Aperçu" />
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- PROGRESS BAR -->
<div class="progress-bar" id="progressBar"><div class="fill" id="progressFill"></div></div>

<script>
/* =========================================================
   APPIXO BOOK — CONSULTATION (v2.4)
   ========================================================= */
const PASSWORD = 'appixo';
const STORAGE_KEY = 'appixo_book_data';

const $ = (id) => document.getElementById(id);
const lockOverlay = $('lockOverlay');
const bookContainer = $('bookContainer');
const lockError = $('lockError');
const pageContent = $('pageContent');
const currentPageEl = $('currentPage');
const totalPagesEl = $('totalPages');
const lightbox = $('lightbox');
const lightboxImg = $('lightboxImg');
const toast = $('toast');
const progressBar = $('progressBar');
const progressFill = $('progressFill');

let bookData = { pages: [] };
let currentIndex = 0;

/* ---------- LOCK ---------- */
function unlock() {
  const val = $('lockPassword').value.trim();
  if (val === PASSWORD) {
    lockOverlay.classList.remove('active');
    bookContainer.classList.remove('locked-blur');
    localStorage.setItem('appixo_unlocked', '1');
    loadBook();
  } else {
    lockError.classList.add('show');
    setTimeout(() => lockError.classList.remove('show'), 2000);
  }
}
$('btnUnlock').addEventListener('click', unlock);
$('lockPassword').addEventListener('keydown', (e) => { if (e.key === 'Enter') unlock(); });

if (localStorage.getItem('appixo_unlocked') === '1') {
  lockOverlay.classList.remove('active');
  bookContainer.classList.remove('locked-blur');
  loadBook();
}

/* ---------- LOAD DATA ---------- */
function loadBook() {
  showProgress(true);
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw) {
    try { bookData = JSON.parse(raw); }
    catch { bookData = { pages: [] }; }
  }
  if (!bookData.pages || !bookData.pages.length) {
    bookData.pages = [{ type: 'cover', image: null }, { type: 'exercise', image: null }];
  }
  totalPagesEl.textContent = bookData.pages.length;
  renderPage();
  showProgress(false);
}

/* ---------- RENDER ---------- */
function renderPage() {
  const page = bookData.pages[currentIndex];
  if (!page) return;
  currentPageEl.textContent = currentIndex + 1;

  if (page.type === 'cover') {
    pageContent.innerHTML = `
      <div class="page-cover" data-zoom="1">
        ${page.image
          ? `<img class="cover-main" src="${page.image}" alt="Couverture" />`
          : `<div class="empty-page-placeholder"><span>📖</span>Page de garde<div class="hint">Aucune couverture</div></div>`}
      </div>`;
  } else {
    pageContent.innerHTML = `
      <div class="exercise-zone">
        ${page.image
          ? `<img class="full-page-image" src="${page.image}" alt="Exercice" />`
          : `<div class="image-placeholder"><span>📝</span>Aucun exercice<div class="hint">En attente de publication</div></div>`}
      </div>`;
  }

  const img = pageContent.querySelector('img');
  if (img) img.addEventListener('click', () => openLightbox(img.src));
}

/* ---------- NAVIGATION ---------- */
$('btnPrev').addEventListener('click', () => {
  if (currentIndex > 0) { currentIndex--; renderPage(); }
  else showToast('Déjà au début', 'info');
});
$('btnNext').addEventListener('click', () => {
  if (currentIndex < bookData.pages.length - 1) { currentIndex++; renderPage(); }
  else showToast('Fin du carnet', 'info');
});

/* Swipe mobile */
let touchStartX = 0;
pageContent.addEventListener('touchstart', (e) => touchStartX = e.touches[0].clientX, { passive: true });
pageContent.addEventListener('touchend', (e) => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 60) {
    if (dx < 0) $('btnNext').click();
    else $('btnPrev').click();
  }
});

/* Clavier */
document.addEventListener('keydown', (e) => {
  if (lockOverlay.classList.contains('active')) return;
  if (e.key === 'ArrowRight') $('btnNext').click();
  if (e.key === 'ArrowLeft') $('btnPrev').click();
  if (e.key === 'Escape') closeLightbox();
});

/* ---------- LIGHTBOX ---------- */
function openLightbox(src) {
  lightboxImg.src = src;
  lightbox.classList.add('open');
}
function closeLightbox() {
  lightbox.classList.remove('open');
  lightboxImg.src = '';
}
$('lightboxClose').addEventListener('click', closeLightbox);
lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });

/* ---------- ACTIONS ---------- */
$('btnPrint').addEventListener('click', () => window.print());
$('btnDownload').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(bookData, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'appixo-book.json';
  a.click();
  showToast('Carnet téléchargé', 'success');
});
$('btnExport').addEventListener('click', () => {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(bookData));
  showToast('Sauvegardé localement', 'success');
});

/* ---------- LANG ---------- */
document.querySelectorAll('#langSwitch button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#langSwitch button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.documentElement.lang = btn.dataset.lang;
    showToast('Langue : ' + btn.dataset.lang.toUpperCase(), 'info');
  });
});

/* ---------- UI HELPERS ---------- */
function showToast(msg, type = 'info') {
  toast.textContent = msg;
  toast.className = 'toast show ' + type;
  setTimeout(() => toast.classList.remove('show'), 2200);
}
function showProgress(on) {
  progressBar.classList.toggle('active', on);
  progressFill.style.width = on ? '70%' : '100%';
  if (on) setTimeout(() => (progressBar.classList.remove('active'), (progressFill.style.width = '0%')), 500);
}
</script>
</body>
</html>
